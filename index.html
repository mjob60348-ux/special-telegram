<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { --bg:#f3f5f7; --card:#fff; --ink:#1d2733; --muted:#5b6b7b; --line:#d5dde5; --accent:#1f6f5c; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14191f; --card:#1c242d; --ink:#e8edf2; --muted:#9aa9b8; --line:#2f3b47; --accent:#4fb99f; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:1rem; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.75rem; }
  h1 { font-size:1.4rem; margin:0 0 .25rem; }
  p.sub { margin:0 0 1.25rem; color:var(--muted); font-size:.95rem; }
  .tabs { display:flex; gap:.5rem; margin-bottom:1.25rem; }
  .tabs button { flex:1; padding:.55rem; border:1px solid var(--line); background:transparent; color:var(--ink);
                 border-radius:6px; font:inherit; cursor:pointer; }
  .tabs button[aria-selected="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { display:block; font-size:.9rem; margin:.8rem 0 .3rem; }
  input { width:100%; padding:.65rem; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink); font:inherit; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .go { width:100%; margin-top:1.2rem; padding:.7rem; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .go:disabled { opacity:.6; cursor:wait; }
  #msg { min-height:1.3rem; margin-top:.9rem; font-size:.9rem; color:var(--err); }
  #msg.ok { color:var(--accent); }
  #welcome { display:none; }
</style>
</head>
<body>
<main>
  <section id="authView">
    <h1>Welcome</h1>
    <p class="sub">Sign in or create an account.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tabSignup" aria-selected="false">Create account</button>
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="go" id="submit" type="button">Sign in</button>
      <div id="msg" role="status"></div>
    </div>
  </section>

  <section id="welcome">
    <h1>You're signed in</h1>
    <p class="sub" id="who"></p>
    <button class="go" id="logout" type="button">Sign out</button>
  </section>
</main>

<script>
  // 1. Paste your Apps Script Web App URL here (ends in /exec)
  const API_URL = "https://script.google.com/macros/s/AKfycbwKJumdsePQlloibYZz93aCDzXWRASIAcQvV8IAvdMLrN7_KuNHymMttEMhhiMPTX5XjQ/exec";

  let mode = "login";
  const $ = id => document.getElementById(id);

  function setMode(m) {
    mode = m;
    $("tabLogin").setAttribute("aria-selected", m === "login");
    $("tabSignup").setAttribute("aria-selected", m === "signup");
    $("submit").textContent = m === "login" ? "Sign in" : "Create account";
    $("password").autocomplete = m === "login" ? "current-password" : "new-password";
    $("msg").textContent = "";
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabSignup").onclick = () => setMode("signup");

  async function callApi(payload) {
    // text/plain avoids a CORS preflight, which Apps Script does not handle
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  function showWelcome(email) {
    $("authView").style.display = "none";
    $("welcome").style.display = "block";
    $("who").textContent = email;
  }

  $("submit").onclick = async () => {
    const email = $("email").value.trim();
    const password = $("password").value;
    const msg = $("msg");
    msg.className = "";
    if (!email || password.length < 8) {
      msg.textContent = "Enter an email and a password of at least 8 characters.";
      return;
    }
    $("submit").disabled = true;
    msg.textContent = "Please wait…";
    try {
      const r = await callApi({ action: mode, email, password });
      if (r.ok && mode === "signup") {
        msg.className = "ok";
        msg.textContent = "Account created. You can sign in now.";
        setMode("login");
        msg.className = "ok";
        msg.textContent = "Account created. You can sign in now.";
      } else if (r.ok) {
        // keep the session token for this browser tab only
        try { sessionStorage.setItem("session", r.token); } catch (e) {}
        showWelcome(email);
      } else {
        msg.textContent = r.error || "Something went wrong.";
      }
    } catch (e) {
      msg.textContent = "Could not reach the server. Check the URL and try again.";
    }
    $("submit").disabled = false;
  };

  $("logout").onclick = () => {
    try { sessionStorage.removeItem("session"); } catch (e) {}
    location.reload();
  };
</script>
</body>
</html>
